name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @averspec/core run build
          pnpm --filter @averspec/telemetry run build
          pnpm --filter @averspec/approvals run build
          pnpm --filter @averspec/protocol-http run build
          pnpm --filter @averspec/protocol-playwright run build

      - name: Publish packages
        run: |
          pnpm --filter @averspec/core publish --no-git-checks --access public
          pnpm --filter @averspec/telemetry publish --no-git-checks --access public
          pnpm --filter @averspec/approvals publish --no-git-checks --access public
          pnpm --filter @averspec/protocol-http publish --no-git-checks --access public
          pnpm --filter @averspec/protocol-playwright publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
